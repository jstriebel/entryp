[project]
name = "entryp"
version = "0.1.5"
description = ""
authors = [{name = "Jonathan Striebel"}]
license = {text = "MIT"}
readme = "README.md"
repository = "https://github.com/jstriebel/entryp"
requires-python = ">=3.7"
dependencies = [
    "typing-extensions>=4.2.0",
]

[dependency-groups]
dev = [
    "black>=22.3.0",
    "isort>=5.10.1",
    "mypy>=0.950",
    "pylint>=2.13.9",
    "pytest>=7.0.0",
    "ruff>=0.12.3",
]

[tool.isort]
profile = "black"

[tool.mypy]
namespace_packages = true
strict_equality = true
show_error_codes = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pylint."MESSAGES CONTROL"]
disable = ["exec-used", "C"]

[tool.ruff]
target-version = "py37"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports are OK in __init__.py

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
